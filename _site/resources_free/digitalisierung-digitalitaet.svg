<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="80 130 1450 950" role="img" aria-labelledby="title desc">
  <title id="title">Digitalisierung – Digitalität</title>
  <desc id="desc">Diagramm mit drei violetten Stufen: Digitalisierung als Kreislauf gesellschaftlicher Kräfte, die in digitale Transformation und den Zustand der Digitalität übergeht.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#000"/>
    </marker>
    <style>
      .title { font: 500 67px Arial, sans-serif; fill: #000; }
      .axis { stroke: #000; stroke-width: 7; fill: none; marker-end: url(#axis-arrow); }
      .axis-label { font: 500 36px Arial, sans-serif; fill: #000; }
      .label { font: 500 34px Arial, sans-serif; fill: #1f1f1f; }
      .small { font: 500 31px Arial, sans-serif; fill: #1f1f1f; }
      .accent { font: 500 45px Arial, sans-serif; fill: #ad0101; }
      .curve { fill: none; stroke: #ad0101; stroke-width: 15; stroke-dasharray: 12 16; }
      .cycle { fill: #faeeee; }
      .arrow-outline { fill: none; stroke: #1f1f1f; stroke-width: 43; stroke-linecap: round; }
      .arrow-fill { fill: none; stroke: #fff; stroke-width: 27; stroke-linecap: round; }
      .arrow-tip { fill: #fff; stroke: #1f1f1f; stroke-width: 8; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#fff"/>
  <!-- Drei Entwicklungsstufen -->
  <rect x="210" y="250" width="395" height="690" fill="#faeeee"/>
  <rect x="605" y="250" width="395" height="690" fill="#f6c4c3"/>
  <rect x="1000" y="250" width="395" height="690" fill="#ed8582"/>

  <!-- Achsen -->
  <path d="M160 940 V190" class="axis"/>
  <path d="M160 940 H1460" class="axis"/>
  <text x="810" y="1035" text-anchor="middle" class="axis-label">Zeit</text>
  <text x="105" y="570" text-anchor="middle" class="axis-label" transform="rotate(-90 105 570)">Bedeutung des Digitalen</text>

  <!-- Kreislauf der Digitalisierung -->
  <circle cx="500" cy="545" r="225" class="cycle"/>
  <path d="M285 565 A225 225 0 0 1 647 398" class="arrow-outline"/>
  <path d="M285 565 A225 225 0 0 1 647 398" class="arrow-fill"/>
  <path d="M654 365 L705 411 L639 431 Z" class="arrow-tip"/>
  <path d="M715 515 A225 225 0 0 1 433 726" class="arrow-outline"/>
  <path d="M715 515 A225 225 0 0 1 433 726" class="arrow-fill"/>
  <path d="M401 747 L418 681 L467 726 Z" class="arrow-tip"/>
  <text x="500" y="395" text-anchor="middle" class="small">gesellschaftliche</text>
  <text x="500" y="432" text-anchor="middle" class="small">Kräfte</text>
  <text x="500" y="665" text-anchor="middle" class="label">Digitalisierung</text>

  <!-- S-Kurve -->
  <path d="M275 900 C500 900 665 845 760 700 C870 530 970 320 1365 270" class="curve"/>
  <text x="710" y="340" class="accent">Wandel</text>
  <text x="1160" y="500" class="accent">Zustand</text>

  <text x="805" y="745" text-anchor="middle" class="small">Digitale</text>
  <text x="805" y="782" text-anchor="middle" class="small">Transformation,</text>
  <text x="805" y="819" text-anchor="middle" class="small">digitaler</text>
  <text x="805" y="856" text-anchor="middle" class="small">Leitmedienwechsel</text>

  <text x="1195" y="745" text-anchor="middle" class="small">Digitalität,</text>
  <text x="1195" y="782" text-anchor="middle" class="small">Kulturen der</text>
  <text x="1195" y="819" text-anchor="middle" class="small">Digitalität,</text>
  <text x="1195" y="856" text-anchor="middle" class="small">postdigital</text>
</svg>
